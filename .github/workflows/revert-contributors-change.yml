name: Validate generated contributors.js changes

on:
  pull_request:
    paths:
      - 'scripts/contributors.js'

permissions: {}

jobs:
  prevent-generated-file-changes:
    name: Prevent changes to generated contributors.js
    runs-on: ubuntu-latest
    steps:
      - name: Explain generated file policy
        run: |
          echo "::error file=scripts/contributors.js::Do not include scripts/contributors.js in pull requests. It is generated automatically; remove it from your PR and submit only source changes."
          exit 1
